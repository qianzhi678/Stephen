<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Places of the World</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/3.5.0/css/flag-icon.min.css">
</head>
<body>
    <div class="container">
        <h1>Places of the World</h1>
        <h2>Created by Stephen</h2>

        <!-- Summary Section -->
        <div id="summary"></div>

        <!-- Filter Form -->
        <form id="filterForm">
            <label for="population">Population Greater Than:</label>
            <input type="number" id="population" name="population" placeholder="e.g., 8000000"><br><br>

            <label for="area">Area Greater Than (km²):</label>
            <input type="number" id="area" name="area" placeholder="e.g., 500000"><br><br>

            <label for="region">Region (e.g., "africa", "asia"):</label>
            <input type="text" id="region" name="region" placeholder="Leave blank for all"><br><br>

            <button type="button" onclick="applyFilter()">Apply Filter</button>
        </form>

        <!-- Country Details Table -->
        <h2>Country Details</h2>
        <table id="countryTable" border="1">
            <thead>
                <tr>
                    <th>Flag</th>
                    <th>Name</th>
                    <th>Capital</th>
                    <th>Population</th>
                    <th>Area (km²)</th>
                    <th>Currencies</th>
                </tr>
            </thead>
            <tbody>
                <!-- Rows will be populated dynamically -->
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
