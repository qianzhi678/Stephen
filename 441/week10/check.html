<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Shopping - Purchase Confirmation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="app-header">
        <div class="container">
            <h1 class="app-title">Idle Shopping</h1>
            <nav class="main-nav">
                <div class="logo">
                    <img src="images/logo.png" alt="Idle Shopping Logo">
                </div>
                <a href="index.html" class="nav-link">Home</a>
                <a href="cart.html" class="nav-link">My Cart</a>
                <a href="check.html" class="nav-link">Checkout</a>
                <a href="browse.html" class="nav-link active">Browse Products</a>
                <div id="user-greeting" class="user-greeting"></div>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="order-confirmed">
            <h2>Purchase Confirmation</h2>
            <p>Thank you for shopping with us!</p>
            <div id="order-total-display" class="order-total-display"></div>
            
            <div class="order-actions">
                <button id="download-json">Download Receipt (JSON)</button>
                <button id="clear-data">Clear Shopping Data</button>
                <button id="logout-now">Logout</button>
            </div>
        </div>
    </main>

    <footer class="app-footer">
        <p>Created by Stephen</p>
        <p>Address: 520 Tech Street, Sydney, NSW 2000, Australia</p>
        <p>Phone: +91 9 5819 7851</p>
        <p>Email: info@idleshopping.com.au</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
