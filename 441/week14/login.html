<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Skills Academy - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="container">
            <nav class="main-nav">
                <div class="nav-branding">Tech Skills Academy</div>
                <div class="nav-links">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="browse.html" class="nav-link">Resource Kits</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="auth-form-container">
            <div class="form-container">
                <h2>Welcome Back</h2>
                <form id="loginForm">
                    <input type="text" id="loginUsername" placeholder="Username" autocomplete="username" required>
                    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required>
                    <button type="submit" class="btn">Sign In</button>
                </form>
                <p class="auth-switch">New to the Academy? <a href="register.html">Create an account</a></p>
            </div>
        </div>
    </main>

    <footer class="app-footer">
        <p>Developed for ICTWEB441 Assessment</p>
        <p>Address: 123 Education Street, Sydney, NSW 2000, Australia</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
