<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Skills Academy - Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="container">
            <nav class="main-nav">
                <div class="nav-branding">Tech Skills Academy</div>
                <div class="nav-links">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="browse.html" class="nav-link">Resource Kits</a>
                </div>
            </nav>
        </div>
    </header>
    
    <main class="container">
        <div class="auth-form-container">
            <div class="form-container">
                <h2>Create Your Account</h2>
                <form id="registerForm">
                    <input type="text" id="regUsername" placeholder="Username" autocomplete="username" required>
                    <input type="email" id="regEmail" placeholder="Email" autocomplete="email" required>
                    <input type="tel" id="regPhone" placeholder="Phone Number" autocomplete="tel" required>
                    <input type="password" id="regPassword" placeholder="Password" autocomplete="new-password" required>
                    <input type="password" id="regConfirmPassword" placeholder="Confirm Password" autocomplete="new-password" required>
                    <button type="submit" class="btn">Sign Up</button>
                </form>
                <p class="auth-switch">Already have an account? <a href="login.html">Login here</a></p>
            </div>
        </div>
    </main>

    <footer class="app-footer">
        <p>Developed for ICTWEB441 Assessment</p>
        <p>Address: 123 Education Street, Sydney, NSW 2000, Australia</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
